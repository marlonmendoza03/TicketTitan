services:
  tickettitan-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      JwtSettings__Secret: ${JwtSettings__Secret}
      JwtSettings__Issuer: ${JwtSettings__Issuer}
      JwtSettings__Audience: ${JwtSettings__Audience}
      JwtSettings__ExpiryInMinutes: ${JwtSettings__ExpiryInMinutes}
      Authentication__Google__ClientId: ${Authentication__Google__ClientId}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VaultUri: ${VaultUri}
    volumes:
      - tickettitan-data:/data
      - ./dataprotection-keys:/app/dataprotection-keys

volumes:
  tickettitan-data: